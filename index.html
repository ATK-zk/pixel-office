<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c08">
<meta name="mobile-web-app-capable" content="yes">
<title>Pixel Office · David Kim Jane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=35">
</head><body>
<canvas id="c"></canvas>
<div id="bubbles"></div>
<div id="board"><div class="bt">💰 พอร์ต <span id="pv">—</span></div><div id="pc">—</div><div id="pu">อัปเดต —</div></div>
<button id="hudbtn" title="ซ่อน/แสดงเมนู">👁</button>
<div id="tl" class="panel">
  <div class="tlhead"><canvas id="meav2" width="24" height="26"></canvas><b>PIXEL OFFICE</b><span id="clock2">--:--</span><span id="dn">☀️</span><span class="chev">▾</span></div>
  <div class="tlbody">
  <div class="menu">
    <button class="ib" data-f="David"><canvas class="mav" data-n="David" width="12" height="12"></canvas><i>David</i></button>
    <button class="ib" data-f="Kim"><canvas class="mav" data-n="Kim" width="12" height="12"></canvas><i>Kim</i></button>
    <button class="ib" data-f="Jane"><canvas class="mav" data-n="Jane" width="12" height="12"></canvas><i>Jane</i></button>
    <button class="ib" data-f="Alex"><canvas class="mav" data-n="Alex" width="12" height="12"></canvas><i>Alex</i></button>
    <button class="ib" data-f="Jhon"><canvas class="mav" data-n="Jhon" width="12" height="12"></canvas><i>Jhon</i></button>
    <button class="ib" data-f="Su"><canvas class="mav" data-n="Su" width="12" height="12"></canvas><i>Su</i></button>
    <button class="ib" id="bfit"><span>🗺️</span><i>ทั้งห้อง</i></button>
  </div>
  <div class="me"><div class="avw"><canvas id="meav" width="24" height="26"></canvas><span class="lv">LV 3</span></div><div class="mebody"><b>PIXEL OFFICE</b>
  <div class="bar"><span class="fill g" style="width:100%"></span><span class="lbl">TEAM</span><em>6/6 ออนไลน์</em></div>
  <div class="bar"><span class="fill b" id="tbar"></span><span class="lbl">DAY</span><em id="clock">--:--</em></div>
  <div id="upd" class="small">⏳ กำลังโหลด…</div></div></div>
  </div>
</div>
<div id="toasts"></div>
<div id="hint">ลากเพื่อเลื่อน · ถ่างนิ้ว/ล้อเมาส์ซูม · แตะ 2 ครั้งรีเซ็ต</div>
<div id="zoombar">
  <div id="vol" class="panel hidden"><div class="vt">♫ เสียง</div><label>🎵 เพลง<input id="mvol" type="range" min="0" max="1" step="0.05"></label><label>🔔 เอฟเฟกต์<input id="svol" type="range" min="0" max="1" step="0.05"></label></div>
  <button id="vbtn" class="rb" title="ระดับเสียง">🎚️</button><button id="snd" class="rb" title="เปิด/ปิดเสียง">🔇</button>
  <button id="zin" class="rb">＋</button><button id="zout" class="rb">－</button><button id="zreset" class="rb">⟲</button>
</div>
<div id="card" class="panel hidden">
  <button id="cardx">✕</button>
  <div class="avw big"><canvas id="avatar" width="24" height="26"></canvas></div>
  <div class="cbody"><div id="cname"></div><div id="crole"></div><div id="cstat"></div><div id="cact"></div><div id="ctime"></div></div>
</div>
<script src="audio.js?v=35"></script>
<script src="art.js?v=35"></script>
<script src="game.js?v=35"></script>
<script src="fx.js?v=35"></script>
<script src="wall.js?v=35"></script>
<script src="decor.js?v=35"></script>
<script src="features.js?v=35"></script>
<script src="life.js?v=35"></script>
</body></html>

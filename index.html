<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>"><title>Office 3D · My Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
<link rel="stylesheet" href="style3d.css?v=12">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js?v=12"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="loading"><div class="ld">🏢 กำลังจัดออฟฟิศ…</div></div>
<div id="fail" class="hidden"><div class="panel">😿 เครื่องนี้เปิดโหมด 3D (WebGL) ไม่ได้<br><small>ลองเปิดใน Safari/Chrome เวอร์ชันล่าสุด หรือปิดโหมดประหยัดพลังงานแล้วโหลดใหม่</small></div></div>
<div id="labels"></div>
<div id="bubbles"></div>
<button id="hudbtn" title="ซ่อน/แสดงเมนู">👁</button>
<div id="tl" class="panel">
  <div class="tlhead"><span class="dot" style="background:#f0c060"></span><b>OFFICE 3D</b><span id="clock2">--:--</span><span id="dn">☀️</span><span class="chev">▾</span></div>
  <div class="tlbody">
  <div class="menu">
    <button class="ib" data-f="David"><span class="dot" style="background:#4a7fd6"></span><i>David</i></button>
    <button class="ib" data-f="Kim"><span class="dot" style="background:#2fa866"></span><i>Kim</i></button>
    <button class="ib" data-f="Jane"><span class="dot" style="background:#e0609a"></span><i>Jane</i></button>
    <button class="ib" data-f="Alex"><span class="dot" style="background:#f0a040"></span><i>Alex</i></button>
    <button class="ib" data-f="Jhon"><span class="dot" style="background:#e05050"></span><i>Jhon</i></button>
    <button class="ib" data-f="Su"><span class="dot" style="background:#9a70e0"></span><i>Su</i></button>
    <button class="ib" id="bfit"><span>🗺️</span><i>ทั้งห้อง</i></button>
    <button class="ib" id="bcat"><span>🐈</span><i>แมว</i></button>
  </div>
  <div class="small" id="upd">⏳ กำลังโหลด…</div>
  </div>
</div>
<div id="toasts"></div>
<div id="hint">ลากเพื่อหมุน · สองนิ้วเลื่อน/ถ่างซูม · แตะตัวละครเพื่อดูงาน</div>
<div id="zoombar">
  <div id="vol" class="panel hidden"><div class="vt">♫ เสียง</div><label>🎵 เพลง<input id="mvol" type="range" min="0" max="1" step="0.05"></label><label>🔔 เอฟเฟกต์<input id="svol" type="range" min="0" max="1" step="0.05"></label></div>
  <button id="vbtn" class="rb" title="ระดับเสียง">🎚️</button><button id="snd" class="rb" title="เปิด/ปิดเสียง">🔇</button>
  <button id="zin" class="rb">＋</button><button id="zout" class="rb">－</button><button id="zreset" class="rb" title="รีเซ็ตกล้อง">⟲</button>
</div>
<div id="card" class="panel hidden">
  <button id="cardx">✕</button>
  <div class="avw big"><span id="cav" class="bigdot"></span></div>
  <div class="cbody"><div id="cname"></div><div id="crole"></div><div id="cstat"></div><div id="ctime"></div></div>
</div>
<script>window.addEventListener('error',e=>{window.__err=(window.__err||[]).concat(String(e.message))});
setTimeout(()=>{if(!window.__ok){document.getElementById('loading').classList.add('hidden');document.getElementById('fail').classList.remove('hidden')}},15000);</script>
<script src="audio.js?v=12"></script>
<script type="module" src="office3d.js?v=12"></script>
</body></html>
